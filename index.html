<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="piercer" />
  <title>Piercer Crypto Wallet, Staking & Airdrop Tracker</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Piercer Crypto Wallet, Staking &amp; Airdrop Tracker</h1>
      <p class="subtitle">Controle multi-carteiras (ETH, SOL, BTC, Arbitrum, Base), simulador de APY/Staking e checklist de Airdrops</p>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Carteiras &amp; Redes (USD)</h2>
      <form id="walletForm" class="w-form">
        <input type="text" id="wLabel" placeholder="Nome (ex: Ledger, Phantom)" required />
        <select id="wNet"><option>Ethereum</option><option>Solana</option><option>Bitcoin</option><option>Arbitrum</option><option>Base</option><option>BSC</option></select>
        <input type="number" id="wUsd" placeholder="Saldo USD" step="1" min="0" required />
        <button type="submit" class="btn btn-primary">+ Wallet</button>
      </form>
      <div id="walletTotal" class="status-box" style="margin:10px 0;">Patrimônio On-Chain: $0.00</div>
      <div id="walletList" class="list"></div>

      <hr class="sep" />
      <h2>Simulador Staking / DeFi APY</h2>
      <div class="row-3">
        <div class="field"><label>Capital (USD)</label><input type="number" id="stkCap" value="2000" min="0" /></div>
        <div class="field"><label>APY (% a.a.)</label><input type="number" id="stkApy" value="14" min="0" step="0.5" /></div>
        <div class="field"><label>Meses</label><input type="number" id="stkMeses" value="12" min="1" max="120" /></div>
      </div>
      <div id="stkOut" class="status-box">Retorno Estimado: $0.00</div>
    </section>

    <section class="card">
      <h2>Rastreador de Airdrops &amp; Testnets</h2>
      <form id="airForm" class="w-form">
        <input type="text" id="airProto" placeholder="Protocolo (ex: Monad, Abstract)" required />
        <input type="text" id="airTask" placeholder="Próxima ação (ex: Bridge + 5 swaps)" required />
        <input type="number" id="airGas" placeholder="Gás gasto ($)" step="0.5" min="0" value="0" />
        <button type="submit" class="btn btn-primary">+ Airdrop</button>
      </form>
      <div id="airList" class="list" style="margin-top:12px;"></div>
    </section>
  </main>
  <script src="./piercer_i18n.js"></script>
  <script src="./app.js"></script>
</body>
</html>
